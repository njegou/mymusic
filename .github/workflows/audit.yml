name: AI Repository Audit

on:
  schedule:
    - cron: '0 8 * * 1' # Tous les lundis à 8h00 UTC
  workflow_dispatch: # Permet de le lancer manuellement à tout moment

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install google-generativeai PyGithub

      - name: Lancer l'agent d'audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/audit_agent.py
